name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: music_chart_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, bcmath, zip, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: music_chart_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
          REDIS_HOST: 127.0.0.1
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Copy environment file
        run: cp .env.example .env

      - name: Validate development Docker Compose configuration
        run: docker compose config

      - name: Validate production Docker Compose configuration
        env:
          IMAGE_REPOSITORY: ghcr.io/example/music-chart
          APP_IMAGE_TAG: ci
          APP_KEY: base64:cGxhY2Vob2xkZXItY2ktdmFsaWRhdGlvbi1rZXk9
          DB_DATABASE: music_chart
          DB_USERNAME: music_chart
          DB_PASSWORD: password
          REDIS_PASSWORD: password
        run: docker compose -f docker-compose.prod.yml config

      - name: Build production app image
        run: docker build --target production -t music-chart:ci .

      - name: Build production web image
        run: docker build --target web -t music-chart-web:ci .
