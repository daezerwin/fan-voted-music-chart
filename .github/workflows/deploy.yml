name: Deploy

# Safe by default: without the PORTAINER_WEBHOOK secret and the
# DEPLOY_ENABLED repository variable set to "true", this workflow only logs
# that it's skipping. This is the spec's "Manual Deployment" interim state —
# CI validates, builds, and pushes to GHCR; an operator updates the Portainer
# stack by hand until automatic deployment is deliberately turned on.
on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: production

    steps:
      - name: Trigger Portainer Stack webhook
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK }}"

      - name: Wait for rollout
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: sleep 15

      - name: Verify health
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          curl -fsS "${{ vars.APP_URL }}/up" || (echo "::error::Health check failed after deployment" && exit 1)

      - name: Skip (automatic deployment not enabled)
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        run: |
          echo "Images were built and pushed to GHCR by the Docker workflow."
          echo "Set the DEPLOY_ENABLED repository/environment variable to 'true' and configure the"
          echo "PORTAINER_WEBHOOK secret and APP_URL variable to automate deployment from here."
          echo "Until then, update the Portainer stack's image tag manually."
