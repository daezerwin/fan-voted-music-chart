# Portainer Stack file for production. Consumes prebuilt, immutable images
# published to GHCR by .github/workflows/docker-publish.yml — nothing is
# built here. Deployment is a manual, operator-triggered "Pull and redeploy"
# in Portainer after a new vX.Y.Z tag is published — not an automatic
# webhook (see README "Production Deployment").
#
# Paste this straight into Portainer's Stacks → Add stack → "Web editor",
# set the environment variables below, and deploy. Every value is inlined
# directly in this file via `${VAR:-default}` substitution — there is no
# `.env` file to create on the host, and no dependency on Portainer's own
# .env-writing behavior.
#
# Required stack variables (see README "Portainer Deployment"):
#   APP_KEY, APP_URL, DB_DATABASE, DB_USERNAME, DB_PASSWORD, REDIS_PASSWORD
# Optional, with sensible defaults below: APP_IMAGE_TAG, APP_PORT,
# APP_TIMEZONE, MAIL_*, FACEBOOK_*, YOUTUBE_API_KEY.
#
# Pin APP_IMAGE_TAG to a specific release instead of always tracking
# `latest`, e.g. APP_IMAGE_TAG=v0.2.0.

x-app-env: &app-env
  APP_NAME: "Fan-Voted Music Chart"
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required — see README "Portainer Deployment"}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}

  LOG_CHANNEL: stack
  LOG_LEVEL: ${LOG_LEVEL:-error}

  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  FILESYSTEM_DISK: local

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: "Fan-Voted Music Chart"

  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}

  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

services:
  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/daezerwin/fan-voted-music-chart}-web:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  app:
    image: ${IMAGE_REPOSITORY:-ghcr.io/daezerwin/fan-voted-music-chart}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  queue:
    image: ${IMAGE_REPOSITORY:-ghcr.io/daezerwin/fan-voted-music-chart}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      <<: *app-env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  scheduler:
    image: ${IMAGE_REPOSITORY:-ghcr.io/daezerwin/fan-voted-music-chart}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?required}
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: --requirepass ${REDIS_PASSWORD:?required}
    volumes:
      - redis_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  database_data:
  redis_data:
